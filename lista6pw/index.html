<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards interativos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="cards card1">
            <img src="/assets/logo-github - Editado.png" alt="Logo Github" class="avatar">
            <h3>Github</h3>
            <span>Entrar em conato via Github</span>
            <button>Seguir</button>
        </div>
        <div class="cards card2">
            <img src="/assets/logo-instagram-removebg-preview.png" alt="Logo Instagram" class="avatar">
            <h3>Instagram</h3>
            <span>Entrar em contato via Instgram</span>
            <button>Seguir</button>
        </div>
        <div class="cards card3">
            <img src="/assets/Logo-Whatsapp - Editado.png" alt="Logo Whatsaap" class="avatar">
            <h3>Whatsaap</h3>
            <span>Entrar em conato via Whatsaap</span>
            <button>Seguir</button>
        </div>
    </div>
</body>
</html>
